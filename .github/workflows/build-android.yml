name: Build VivaFrutaz Tracker Android Debug

on:
  push:
    paths:
      - "vivafrutaz-tracker-android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android-debug:
    name: Build Tracker debug APK
    runs-on: ubuntu-latest

    env:
      TRACKER_BASE_URL: https://portal-vivafrutaz-2-1--replitcod2.replit.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Verify Gradle Wrapper
        working-directory: vivafrutaz-tracker-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Configure permanent Tracker signing
        if: ${{ secrets.TRACKER_KEYSTORE_BASE64 != '' && secrets.TRACKER_KEYSTORE_PASSWORD != '' && secrets.TRACKER_KEY_ALIAS != '' }}
        shell: bash
        env:
          TRACKER_KEYSTORE_BASE64: ${{ secrets.TRACKER_KEYSTORE_BASE64 }}
          TRACKER_KEYSTORE_PASSWORD: ${{ secrets.TRACKER_KEYSTORE_PASSWORD }}
          TRACKER_KEY_ALIAS: ${{ secrets.TRACKER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          key_path="$GITHUB_WORKSPACE/vivafrutaz-tracker-android/tracker-permanent.jks"
          printf '%s' "$TRACKER_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "TRACKER_KEYSTORE_FILE=$key_path"
            echo "TRACKER_KEYSTORE_PASSWORD=$TRACKER_KEYSTORE_PASSWORD"
            echo "TRACKER_KEY_ALIAS=$TRACKER_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK with Gradle Wrapper
        working-directory: vivafrutaz-tracker-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            -PTRACKER_BASE_URL="${TRACKER_BASE_URL}" \
            --stacktrace \
            --info

      - name: Verify APK
        shell: bash
        run: |
          ls -lah vivafrutaz-tracker-android/app/build/outputs/apk/debug/
          test -f vivafrutaz-tracker-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Tracker debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vivafrutaz-tracker-debug
          path: vivafrutaz-tracker-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
