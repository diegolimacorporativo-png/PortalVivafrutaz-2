name: Build VivaFrutaz Tracker Android Debug

on:
  push:
    paths:
      - "vivafrutaz-tracker-android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android-debug:
    name: Build Tracker debug APK
    runs-on: ubuntu-latest

    env:
      TRACKER_BASE_URL: https://portal-vivafrutaz-2-1--replitcod2.replit.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle Wrapper
        working-directory: vivafrutaz-tracker-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK with Gradle Wrapper
        working-directory: vivafrutaz-tracker-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug \
            -PTRACKER_BASE_URL="${TRACKER_BASE_URL}" \
            --stacktrace \
            --info

      - name: Verify APK
        shell: bash
        run: |
          ls -lah vivafrutaz-tracker-android/app/build/outputs/apk/debug/
          test -f vivafrutaz-tracker-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Tracker debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vivafrutaz-tracker-debug
          path: vivafrutaz-tracker-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
