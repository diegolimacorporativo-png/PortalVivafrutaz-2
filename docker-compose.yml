version: '3.9'

services:
  app:
    build: .
    container_name: vivafrutaz_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - vivafrutaz_net

networks:
  vivafrutaz_net:
    driver: bridge
